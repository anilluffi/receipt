<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Розписка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #fff;
    }

    /* ЧЕКОВЫЙ ФОРМАТ */
    .sheet {
      width: 300px; /* 80mm принтер */
      margin: 0 auto;
      padding: 10px;
    }

    .title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .row {
      font-size: 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: flex-end;
    }

    .label {
      white-space: nowrap;
    }

    .line {
      flex: 1;
      border-bottom: 1px solid #000;
      height: 16px;
      margin-left: 6px;
    }

    .sum-block {
      margin: 8px 0;
    }

    .sum-title {
      font-size: 14px;
      display: flex;
      align-items: flex-end;
      margin-bottom: 4px;
    }

    .sum-line {
      flex: 1;
      border-bottom: 1px solid #000;
      height: 16px;
      margin-left: 6px;
    }

    .hint {
      font-size: 12px;
      margin-left: 6px;
      white-space: nowrap;
    }

    .sum-text {
      border-bottom: 1px solid #000;
      height: 16px;
    }

    .bottom {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .col {
      flex: 1;
      font-size: 14px;
    }

    .col .line {
      margin-left: 0;
    }

    @media print {
      body {
        width: 80mm;
      }

      .sheet {
        width: 80mm;
      }
    }
  </style>
</head>

<body>
  <div class="sheet">

    <div class="title">РОЗПИСКА</div>

    <div class="row">
      <div class="label">Дана</div>
      <div class="line"></div>
    </div>

    <div class="row">
      <div class="label">№ телефону</div>
      <div class="line"></div>
    </div>

    <div class="sum-block">
      <div class="sum-title">
        Сума
        <div class="sum-line"></div>
        <div class="hint">(цифра)</div>
      </div>

      <div class="sum-text"></div>
      <div class="hint">(пропис)</div>
    </div>

    <!-- ОПЕРАТОР УБРАН -->

    <div class="row">
      <div class="label">№ тел робочий</div>
      <div class="line"></div>
    </div>

    <div class="bottom">
      <div class="col">
        <div class="label">Дата</div>
        <div class="line"></div>
      </div>

      <div class="col">
        <div class="label">Підпис</div>
        <div class="line"></div>
      </div>
    </div>

  </div>
</body>
</html>
