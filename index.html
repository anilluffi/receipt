<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Розписка</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background: #fff;
    font-family: Arial, Helvetica, sans-serif;
  }

  .sheet {
    width: 80mm;
    padding: 1.5mm;
    border: 1px solid #000;
  }

  .title {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    margin: 0 0 2px;
  }

  .row {
    display: flex;
    align-items: flex-end;
    font-size: 9px;
    margin: 0;
    line-height: 1;
  }

  .label {
    white-space: nowrap;
    margin-right: 2px;
  }

  .line {
    flex: 1;
    border-bottom: 1px solid #000;
    height: 8px;
  }

  .sum {
    margin: 2px 0;
  }

  .sum-top,
  .sum-bottom {
    display: flex;
    align-items: flex-end;
    font-size: 9px;
    margin: 0;
    line-height: 1;
  }

  .hint {
    margin-left: 2px;
    font-size: 8px;
    white-space: nowrap;
  }

  .bottom {
    display: flex;
    gap: 4px;
    margin-top: 2px;
  }

  .bottom .row {
    flex: 1;
  }

  @media print {
    body {
      margin: 0;
    }

    .sheet {
      border: 1px solid #000;
    }
  }
</style>
</head>

<body>
<div class="sheet">

  <div class="title">РОЗПИСКА</div>

  <div class="row">
    <div class="label">Дана</div>
    <div class="line"></div>
  </div>

  <div class="row">
    <div class="label">№ телефону</div>
    <div class="line"></div>
  </div>

  <div class="sum">
    <div class="sum-top">
      <div class="label">Сума</div>
      <div class="line"></div>
      <div class="hint">(цифра)</div>
    </div>

    <div class="sum-bottom">
      <div class="label"></div>
      <div class="line"></div>
      <div class="hint">(пропис)</div>
    </div>
  </div>

  <div class="row">
    <div class="label">Оператор</div>
    <div class="line"></div>
  </div>

  <div class="row">
    <div class="label">№тел робочий</div>
    <div class="line"></div>
  </div>

  <div class="bottom">
    <div class="row">
      <div class="label">Дата</div>
      <div class="line"></div>
    </div>

    <div class="row">
      <div class="label">Підпис</div>
      <div class="line"></div>
    </div>
  </div>

</div>
</body>
</html>
